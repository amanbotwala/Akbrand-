<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Akbrand Assistant</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--card:#181818;--sidebar:#0f0f0f;--text:#fff;--border:#2a2a2a;--green:#00ff88;--hover:#222}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px;transition:0.3s;z-index:100}
#sidebar.collapsed{margin-left:-260px}
.sidebar-top{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--border);margin-bottom:10px}
.logo{width:32px;height:32px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.new-chat-btn{width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px}
.new-chat-btn:hover{background:var(--hover)}
#historyList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-top:12px}
.history-item{padding:10px 12px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bbb}
.history-item:hover,.history-item.active{background:var(--hover);color:#fff}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:10px;margin-top:auto}
.side-btn{width:100%;padding:10px 12px;border-radius:8px;background:transparent;border:0;color:#bbb;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;font-size:13px}
.side-btn:hover{background:var(--hover);color:#fff}
#mainWrap{flex:1;display:flex;flex-direction:column;position:relative}
.header{height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--bg)}
.header h1{font-size:16px;font-weight:600;opacity:.9}
.header.sub{font-size:11px;color:#888}
#main{flex:1;display:none;flex-direction:column;overflow:hidden;background:#000}
#login{display:flex;align-items:center;justify-content:center;flex:1;background:#000}
.login-box{background:#111;padding:30px;border-radius:16px;border:1px solid var(--border);width:90%;max-width:380px;text-align:center}
input,textarea{width:100%;padding:14px;margin:8px 0;border-radius:12px;background:#1e1e1e;color:#fff;border:1px solid var(--border);outline:none}
button.primary{width:100%;padding:12px;background:#fff;border:0;border-radius:12px;font-weight:700;color:#000;cursor:pointer;margin-top:10px}
#chatArea{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.msg{padding:14px 16px;border-radius:18px;max-width:85%;line-height:1.6;font-size:14px;white-space:pre-wrap}
.user{background:#fff;color:#000;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#171717;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
#welcomeCenter{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:12px;color:#aaa}
.input-bar{padding:12px 16px;border-top:1px solid var(--border);background:#000;max-width:800px;margin:0 auto;width:100%;display:flex;gap:10px;align-items:end}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#1e1e1e;border:1px solid var(--border);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#settingsModal{display:none;position:fixed;inset:0;background:#000000cc;z-index:5000;align-items:center;justify-content:center}
#settingsModal.open{display:flex}
.modal{background:#111;width:90%;max-width:420px;border-radius:20px;border:1px solid var(--border);overflow:hidden}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
#menuBtn{display:none}
@media(max-width:768px){#sidebar{position:fixed;left:0;top:0;bottom:0}#menuBtn{display:flex}}
</style></head><body>

<div id="sidebar">
<div class="sidebar-top"><div class="logo">A</div><div style="font-weight:700">Akbrand</div><button onclick="toggleSidebar()" style="margin-left:auto;background:0;border:0;color:#888"><i class="fa fa-xmark"></i></button></div>
<button class="new-chat-btn" onclick="newChat()"><i class="fa fa-plus"></i> New chat</button>
<div id="historyList"></div>
<div class="sidebar-bottom">
<button class="side-btn" onclick="openSettings()"><i class="fa fa-ellipsis"></i> Settings & Live Search</button>
<button class="side-btn" onclick="clearAllChats()"><i class="fa fa-trash"></i> Clear chats</button>
<div class="side-btn" id="userEmailDisplay"><i class="fa fa-user"></i> <span>...</span></div>
<button class="side-btn" onclick="logout()"><i class="fa fa-right-from-bracket"></i> Log out</button>
</div></div>

<div id="mainWrap">
<div class="header">
<button id="menuBtn" class="icon-btn" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
<div><h1>Akbrand Assistant</h1><div class="sub">How can I help you today?</div></div>
<div style="margin-left:auto"><button onclick="openSettings()" style="background:0;border:0;color:#888;font-size:18px"><i class="fa fa-ellipsis-vertical"></i></button></div>
</div>

<div id="login"><div class="login-box"><div class="logo" style="margin:0 auto 12px;width:56px;height:56px;font-size:24px">A</div><h2 style="margin-bottom:6px">Welcome back</h2><p style="color:#888;font-size:13px;margin-bottom:14px">Login once - no more login again</p><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password (6+ chars)"><button class="primary" onclick="loginEmail()">Continue</button></div></div>

<div id="main"><div id="chatArea"><div id="history"></div><div id="welcomeCenter" style="display:none"><h2 style="color:#fff;font-size:28px">What can I help with?</h2><p>Ask anything - Images, PDF, Translation, Coding</p></div></div>
<div class="input-bar"><label class="icon-btn" style="cursor:pointer"><i class="fa fa-paperclip"></i><input type="file" id="imgInput" accept="image/*,.pdf" hidden onchange="loadImg(event)"></label><textarea id="q" rows="1" placeholder="Message Akbrand..." oninput="autoGrow(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAk()}"></textarea><button class="icon-btn" style="background:#fff;color:#000" onclick="askAk()"><i class="fa fa-arrow-up"></i></button></div><img id="preview" style="max-width:90px;border-radius:8px;display:none;margin:0 auto"></div>
</div>

<div id="settingsModal"><div class="modal"><div class="modal-head"><h3>Settings</h3><button onclick="closeSettings()" style="background:0;border:0;color:#fff;font-size:22px">×</button></div><div class="modal-body">
<div id="accountInfo" style="font-size:13px;color:#bbb;margin-bottom:14px"></div>
<label style="font-size:13px"><input type="checkbox" id="liveToggle"> Live Web Search (latest news, prices, weather)</label>
<p style="font-size:11px;color:#666;margin-top:8px">Enable karne pe real-time search karega</p>
<div style="margin-top:18px"><button onclick="logout()" class="side-btn" style="background:#1e1e1e">Log out from all devices</button></div>
</div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAlCB1ZXq8Q7TbZn9ud1hwga9F6qNi3Idw",authDomain:"akbrand-251b0.firebaseapp.com",projectId:"akbrand-251b0",storageBucket:"akbrand-251b0.firebasestorage.app",messagingSenderId:"632009403430",appId:"1:632009403430:web:aa159412dd7b05c462cae7"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);
let base64Img="",currentChatId=null;
window.toggleSidebar=()=>document.getElementById('sidebar').classList.toggle('collapsed');
window.openSettings=()=>document.getElementById('settingsModal').classList.add('open');
window.closeSettings=()=>document.getElementById('settingsModal').classList.remove('open');
window.autoGrow=(el)=>{el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
window.loadImg=(e)=>{let f=e.target.files[0];let r=new FileReader();r.onload=()=>{base64Img=r.result;preview.src=base64Img;preview.style.display='block';};r.readAsDataURL(f);}
window.newChat=()=>{currentChatId=Date.now().toString();document.getElementById('history').innerHTML='';document.getElementById('welcomeCenter').style.display='flex';saveCurrentChat();loadChats();}
function saveCurrentChat(){let html=document.getElementById('history').innerHTML;let chats=JSON.parse(localStorage.getItem('ak_chats')||'[]');let title=(document.getElementById('history').innerText.slice(0,35)||'New Chat');if(!html.trim()){document.getElementById('welcomeCenter').style.display='flex';return}document.getElementById('welcomeCenter').style.display='none';let ex=chats.find(c=>c.id===currentChatId);if(ex){ex.html=html;ex.title=title}else{chats.unshift({id:currentChatId,title:title,html:html,time:Date.now()});if(chats.length>50)chats.pop();}localStorage.setItem('ak_chats',JSON.stringify(chats));loadChats();}
window.loadChats=()=>{let chats=JSON.parse(localStorage.getItem('ak_chats')||'[]');historyList.innerHTML='';chats.forEach(c=>{let d=document.createElement('div');d.className='history-item'+(c.id===currentChatId?' active':'');d.textContent=c.title;d.onclick=()=>{currentChatId=c.id;document.getElementById('history').innerHTML=c.html;document.getElementById('welcomeCenter').style.display='none';loadChats();if(window.innerWidth<768)toggleSidebar();};historyList.appendChild(d);});}
window.clearAllChats=()=>{if(confirm("Clear all chats?")){localStorage.removeItem('ak_chats');loadChats();newChat();}}
window.loginEmail=async()=>{let e=email.value.trim(),p=password.value;if(!e||p.length<6){alert("Email & 6+ password needed");return}try{await signInWithEmailAndPassword(auth,e,p);}catch(err){if(err.code.includes('user-not-found')||err.code.includes('invalid-credential')||err.code.includes('invalid-login')){await createUserWithEmailAndPassword(auth,e,p);}else alert(err.message)}};
window.logout=async()=>{await signOut(auth);location.reload();};
onAuthStateChanged(auth,(user)=>{if(user){login.style.display='none';main.style.display='flex';userEmailDisplay.innerHTML=`<i class="fa fa-user"></i> <span>${user.email}</span>`;accountInfo.innerHTML=`Logged in as <b>${user.email}</b>`;loadChats();if(!currentChatId)newChat();}else{login.style.display='flex';main.style.display='none';}});
window.askAk=async()=>{let qu=q.value.trim();let h=document.getElementById('history');if(!qu&&!base64Img)return;if(!currentChatId)currentChatId=Date.now().toString();document.getElementById('welcomeCenter').style.display='none';h.innerHTML+=`<div class="msg user">${qu||"Image"}</div>`;q.value='';let tempId='t'+Date.now();h.innerHTML+=`<div class="msg ai" id="${tempId}">Thinking...</div>`;h.parentElement.scrollTop=h.parentElement.scrollHeight;
if(!base64Img&&(qu.toLowerCase().includes("photo")||qu.toLowerCase().includes("image")||qu.toLowerCase().includes("poster")||qu.toLowerCase().includes("logo")||qu.toLowerCase().includes("banao"))){let img=`https://image.pollinations.ai/prompt/${encodeURIComponent(qu)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;document.getElementById(tempId).innerHTML=`<img src="${img}" style="width:100%;border-radius:12px"><br><a href="${img}" target="_blank" style="color:#fff;text-decoration:underline">Download</a>`;saveCurrentChat();preview.style.display='none';base64Img='';return;}
let liveOn=document.getElementById('liveToggle').checked;let payload;if(base64Img){payload={model:"llama-3.2-11b-vision-preview",messages:[{role:"user",content:[{type:"text",text:qu||"Describe this image in same language as user used"},{type:"image_url",image_url:{url:base64Img}}]}]};}else{payload={model:"llama-3.3-70b-versatile",messages:[{role:"system",content:`You are Akbrand Assistant - a friendly, real ChatGPT-like assistant. Rules: 1) Detect user language and ALWAYS reply in SAME language user used. 2) Support translation, coding, images, pdf, all tasks. 3) Never say "Error", give helpful answer. 4) If live search enabled context available: ${liveOn?"Use latest info":""}. 5) Be concise, helpful, real app feel.`},{role:"user",content:qu}]};}
try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});let d=await r.json();let ans=d.choices?.[0]?.message?.content||d.error||"Sorry, I couldn't get that. Try again.";document.getElementById(tempId).innerText=ans;saveCurrentChat();}catch(e){document.getElementById(tempId).innerText="Connection slow hai, fir se try karo. (Tip: Vercel me GROQ_API_KEY check karo)";}h.parentElement.scrollTop=h.parentElement.scrollHeight;preview.style.display='none';base64Img='';}
</script></body></html>
